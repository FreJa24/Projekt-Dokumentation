name: Secret testen

on:
  workflow_dispatch:

permissions: {}

jobs:
  secret-test:
    runs-on: ubuntu-latest

    steps:
      - name: API-Token prüfen
        shell: bash
        env:
          DOCS_API_TOKEN: ${{ secrets.DOCS_API_TOKEN }}
        run: |
          if [ -z "$DOCS_API_TOKEN" ]; then
            echo "Der Test-Token fehlt."
            exit 1
          fi

          echo "Der Test-Token ist verfügbar."
